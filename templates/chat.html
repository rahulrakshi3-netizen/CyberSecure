{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card glass-panel">
            <div class="card-header bg-primary bg-opacity-25 border-bottom border-primary">
                <h5 class="mb-0 d-flex align-items-center">
                    <i class="fas fa-robot fs-3 me-3 text-info"></i>
                    <div>
                        Cyber AI Assistant
                        <div class="small text-info opacity-75 fs-6 fw-normal">Online</div>
                    </div>
                </h5>
            </div>
            <div class="card-body p-0">
                <div class="chat-window" id="chat-window">
                    <div class="chat-msg bot">
                        Hello! I am your AI Cybersecurity Assistant. How can I help you today?
                    </div>
                </div>
                <div class="p-3 border-top border-secondary">
                    <form id="chat-form" class="d-flex gap-2">
                        <input type="text" id="chat-input" class="form-control" placeholder="Type your message..." required autocomplete="off">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i></button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('chat-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const input = document.getElementById('chat-input');
        const message = input.value.trim();
        if (!message) return;
        
        const chatWindow = document.getElementById('chat-window');
        
        // Add user message
        const userDiv = document.createElement('div');
        userDiv.className = 'chat-msg user';
        userDiv.textContent = message;
        chatWindow.appendChild(userDiv);
        
        input.value = '';
        chatWindow.scrollTop = chatWindow.scrollHeight;
        
        // Fetch response
        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: message })
            });
            const data = await response.json();
            
            const botDiv = document.createElement('div');
            botDiv.className = 'chat-msg bot';
            botDiv.textContent = data.response;
            chatWindow.appendChild(botDiv);
            
            chatWindow.scrollTop = chatWindow.scrollHeight;
        } catch (error) {
            console.error('Error:', error);
        }
    });
</script>
{% endblock %}
