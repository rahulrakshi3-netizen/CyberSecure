{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card glass-panel mt-5">
            <div class="card-header text-center">
                <h4 class="mb-0">{% if is_admin %}Admin Registration{% else %}User Registration{% endif %}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email address</label>
                        <input type="email" class="form-control" name="email" autocomplete="email" required>
                        <div class="form-text text-secondary">Login verification codes will be sent to this address.</div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-user-plus me-2"></i>Register
                    </button>
                </form>
            </div>
        </div>
        <div class="mt-3 text-center text-muted small">
            <p>Already have an account? <a href="{% if is_admin %}{{ url_for('admin_login') }}{% else %}{{ url_for('login') }}{% endif %}" class="text-info fw-bold">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}
