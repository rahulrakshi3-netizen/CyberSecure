{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card glass-panel mb-4">
            <div class="card-header border-bottom border-secondary">
                <h5 class="mb-0"><i class="fas fa-random text-success me-2"></i>Secure Password Generator</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-4">
                        <label class="form-label text-secondary d-flex justify-content-between">
                            <span>Password Length</span>
                            <span id="lengthValue" class="text-info">16</span>
                        </label>
                        <input type="range" class="form-range" name="length" id="length" min="8" max="64" value="16" oninput="document.getElementById('lengthValue').innerText = this.value">
                    </div>
                    
                    <div class="mb-4">
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="use_upper" name="use_upper" checked>
                            <label class="form-check-label text-secondary" for="use_upper">Include Uppercase Letters (A-Z)</label>
                        </div>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="use_lower" name="use_lower" checked>
                            <label class="form-check-label text-secondary" for="use_lower">Include Lowercase Letters (a-z)</label>
                        </div>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="use_digits" name="use_digits" checked>
                            <label class="form-check-label text-secondary" for="use_digits">Include Numbers (0-9)</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="use_special" name="use_special" checked>
                            <label class="form-check-label text-secondary" for="use_special">Include Symbols (!@#$...)</label>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">Generate Password</button>
                </form>
            </div>
        </div>

        {% if generated_password %}
        <div class="card glass-panel">
            <div class="card-body text-center py-5">
                <h6 class="text-secondary mb-3">Generated Password:</h6>
                <div class="bg-dark p-3 rounded mb-3 position-relative">
                    <code class="fs-4 text-info user-select-all" id="genPwd">{{ generated_password }}</code>
                </div>
                <button class="btn btn-outline-info" onclick="copyToClipboard()">
                    <i class="fas fa-copy me-2"></i>Copy to Clipboard
                </button>
            </div>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function copyToClipboard() {
        var copyText = document.getElementById("genPwd").innerText;
        navigator.clipboard.writeText(copyText).then(function() {
            alert("Password copied to clipboard!");
        }, function(err) {
            console.error('Could not copy text: ', err);
        });
    }
</script>
{% endblock %}
