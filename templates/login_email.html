{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card glass-panel mt-5">
            <div class="card-header text-center">
                <h4 class="mb-0">Add an Email for Login Verification</h4>
            </div>
            <div class="card-body">
                <p class="text-secondary">
                    Account <strong>{{ username }}</strong> does not have an email saved yet.
                    Enter an address you can access. We will email a one-time code and link
                    this address to the account after the code is verified.
                </p>
                <form method="POST">
                    <div class="mb-4">
                        <label class="form-label" for="email">Email address</label>
                        <input id="email" type="email" class="form-control" name="email"
                               autocomplete="email" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-envelope me-2"></i>Send Verification Code
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
